<!doctype html>
<html lang="en">
<head>

  <title>Solo Stereo — fluid animation options</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#080c08;color:#dce8d2;font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column}header{padding:18px 24px;display:flex;align-items:center;gap:28px;border-bottom:1px solid #c9ff9530;background:#10170e}h1{font-size:14px;white-space:nowrap;margin:0;font-weight:500}nav{display:flex;gap:7px;margin:auto}button{font:12px Arial;background:transparent;color:#9fb28f;border:1px solid transparent;padding:12px 16px;cursor:pointer;border-radius:4px}button[aria-pressed=true]{color:#caff81;background:#bdff6310;border-color:#c2ff6235}button:hover{border-color:#c2ff6255}a{color:#caff81;font-size:12px;white-space:nowrap;text-decoration:none}iframe{display:block;border:0;flex:1;min-height:0;width:100%;background:#020402}footer{border-top:1px solid #c9ff9520;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#10170e}p{font-size:12px;line-height:1.5;color:#9fb28f;margin:0}small{color:#687c59;font-size:10px}#pause{border-color:#c9ff9520;white-space:nowrap}button:focus-visible,a:focus-visible{outline:2px solid #b5ff4c;outline-offset:4px}@media(max-width:750px){header{flex-wrap:wrap;padding:15px;gap:15px}nav{order:3;width:100%;gap:3px}nav button{flex:1;padding:12px 6px;font-size:11px}header a{margin-left:auto}footer{padding:14px;align-items:flex-start}small{display:none}iframe{min-height:320px}}
  </style>
  <script src="tape-options.js" defer></script>
</head>
<body>
  <header><h1>solo stereo / motion studies</h1><nav aria-label="Fluid animation"><button data-motion="mercury" aria-pressed="true">01 Liquid Mercury</button><button data-motion="ink" aria-pressed="false">02 Green Ink</button><button data-motion="aurora" aria-pressed="false">03 Aurora Gel</button></nav><a id="full" href="tape.html?motion=mercury">Open stereo only ↗</a></header>
  <iframe id="preview" src="tape.html?motion=mercury" title="Stereo-only homepage with the selected fluid animation"></iframe>
  <footer><div><p id="description">Liquid Mercury — glossy, rolling folds with bright green reflections.</p><small>Ambient motion · sample listening history · the stereo's play button opens the archive.</small></div><button id="pause" aria-pressed="false">Pause motion</button></footer>
</body>
</html>
